[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["atlas/vision/ocr_engine.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM"]
ignore = [
    "B008",
    "B024",
    "B027",
    "B904",
    "E501",
    "N802",
    "SIM105",
    "SIM108",
    "UP006",
    "UP007",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
files = ["atlas"]
