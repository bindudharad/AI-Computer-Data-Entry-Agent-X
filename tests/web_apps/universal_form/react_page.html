<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Universal Form - React Style</title>
<style>
  body { font-family: sans-serif; margin: 24px; color: #222; }
  form { max-width: 640px; }
  .row { margin: 10px 0; }
  label { display: inline-block; width: 190px; vertical-align: top; font-weight: 600; }
  input[type="text"], select, textarea { width: 300px; padding: 5px; border: 1px solid #999; border-radius: 3px; }
  .custom-select { position: relative; display: inline-block; }
  .custom-select input { width: 300px; }
  .listbox { position: absolute; top: 100%; left: 0; width: 300px; border: 1px solid #999; background: #fff; z-index: 10; max-height: 140px; overflow: auto; display: none; }
  .listbox.visible { display: block; }
  .listbox div { padding: 5px 8px; cursor: pointer; }
  .listbox div:hover { background: #eef; }
  .scrollable { overflow: auto; max-height: 120px; border: 1px dashed #bbb; padding: 8px; }
  .hidden-row { display: none; }
</style>
</head>
<body>
  <h1>Universal Form - React Style</h1>
  <p>Custom combobox, dependent selects, dynamic field and scrollable sections.</p>
  <form id="app-form">
    <div class="row">
      <label for="f-emp">Employee Name</label>
      <input id="f-emp" name="employee_name" type="text">
    </div>
    <div class="row">
      <label for="f-dept">Department</label>
      <span class="custom-select">
        <input id="f-dept" name="department" type="text" role="combobox" aria-label="Department"
               aria-expanded="false" autocomplete="off" placeholder="Select department...">
        <div class="listbox" id="f-dept-list" role="listbox">
          <div data-value="engineering">Engineering</div>
          <div data-value="sales">Sales</div>
          <div data-value="marketing">Marketing</div>
          <div data-value="hr">Human Resources</div>
          <div data-value="finance">Finance</div>
          <div data-value="support">Support</div>
        </div>
      </span>
    </div>
    <div class="row">
      <label for="f-country">Country</label>
      <select id="f-country" name="country">
        <option value="">-- select --</option>
        <option value="IN">India</option>
        <option value="US">USA</option>
        <option value="GB">UK</option>
      </select>
    </div>
    <div class="row">
      <label for="f-state">State</label>
      <select id="f-state" name="state"><option value="">-- select country first --</option></select>
    </div>
    <div class="row">
      <label for="f-city">City</label>
      <select id="f-city" name="city"><option value="">-- select state first --</option></select>
    </div>
    <div class="row">
      <label for="f-extra-toggle">Include Extra Notes</label>
      <input id="f-extra-toggle" name="include_extra_notes" type="checkbox">
    </div>
    <div class="row hidden-row" id="extra-row">
      <label for="f-extra">Extra Notes</label>
      <textarea id="f-extra" name="extra_notes" placeholder="optional extra notes"></textarea>
    </div>
    <div class="scrollable">
      <div class="row">
        <label for="f-addr">Address</label>
        <textarea id="f-addr" name="address"></textarea>
      </div>
      <div class="row">
        <label for="f-note">Remarks</label>
        <textarea id="f-note" name="remarks"></textarea>
      </div>
    </div>
    <div class="row">
      <button id="f-submit" type="submit">Save Record</button>
    </div>
  </form>

<script>
  const states = {
    "IN": ["Maharashtra", "Karnataka", "Delhi"],
    "US": ["California", "Texas", "New York"],
    "GB": ["England", "Scotland"],
  };
  const cities = {
    "Maharashtra": ["Mumbai", "Pune"],
    "Karnataka": ["Bengaluru"],
    "Delhi": ["New Delhi"],
    "California": ["San Francisco", "Los Angeles"],
    "Texas": ["Houston"],
    "New York": ["New York City"],
    "England": ["London"],
    "Scotland": ["Edinburgh"],
  };
  const country = document.getElementById("f-country");
  const state = document.getElementById("f-state");
  const city = document.getElementById("f-city");
  function fillOptions(sel, names) {
    sel.innerHTML = "";
    const blank = document.createElement("option");
    blank.value = "";
    blank.textContent = "-- select --";
    sel.appendChild(blank);
    names.forEach(n => {
      const o = document.createElement("option");
      o.textContent = n;
      sel.appendChild(o);
    });
  }
  country.addEventListener("change", () => {
    fillOptions(state, states[country.value] || []);
    city.innerHTML = '<option value="">-- select state first --</option>';
  });
  state.addEventListener("change", () => {
    fillOptions(city, cities[state.value] || []);
  });

  // Custom React-style combobox.
  const deptInput = document.getElementById("f-dept");
  const deptList = document.getElementById("f-dept-list");
  const deptOptions = Array.from(deptList.querySelectorAll("div[data-value]"));
  deptInput.addEventListener("focus", () => {
    deptList.classList.add("visible");
    deptInput.setAttribute("aria-expanded", "true");
  });
  deptInput.addEventListener("input", () => {
    const q = deptInput.value.trim().toLowerCase();
    deptOptions.forEach(o => { o.style.display = q && !o.textContent.toLowerCase().includes(q) ? "none" : ""; });
    deptList.classList.add("visible");
    deptInput.setAttribute("aria-expanded", "true");
  });
  deptOptions.forEach(o => {
    o.addEventListener("mousedown", (e) => {
      e.preventDefault();
      deptInput.value = o.textContent.trim();
      deptInput.setAttribute("data-selected", o.getAttribute("data-value"));
      deptList.classList.remove("visible");
      deptInput.setAttribute("aria-expanded", "false");
    });
  });
  deptInput.addEventListener("blur", () => {
    setTimeout(() => deptList.classList.remove("visible"), 120);
  });
  deptInput.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" && deptList.classList.contains("visible")) {
      const vis = deptOptions.filter(o => o.style.display !== "none");
      if (vis.length) { deptInput.value = vis[0].textContent.trim(); e.preventDefault(); }
    }
  });

  const toggle = document.getElementById("f-extra-toggle");
  toggle.addEventListener("change", () => {
    document.getElementById("extra-row").style.display = toggle.checked ? "block" : "none";
  });
  document.getElementById("app-form").addEventListener("submit", (e) => {
    e.preventDefault();
    document.getElementById("f-submit").textContent = "Saved";
  });
</script>
</body>
</html>
